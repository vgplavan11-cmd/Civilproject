<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- Background Blueprint Grid -->
  <rect width="800" height="500" fill="url(#grid)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Title & Specification Stamp -->
  <rect x="40" y="35" width="260" height="42" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">XYZ CIVIL ENGINEERING ARCHIVE</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="600">PLAN: 2BHK HORIZON (1,140 SQ.FT)</text>

  <!-- External Building Outline (Thick Wall) -->
  <rect x="120" y="100" width="560" height="340" fill="#ffffff" stroke="#0f172a" stroke-width="5" rx="2"/>

  <!-- Interior Rooms Partitioning -->
  <!-- Living & Dining Room -->
  <rect x="120" y="100" width="320" height="200" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="210" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">LIVING &amp; DINING</text>
  <text x="230" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2563eb" font-weight="600">16'0" x 11'6"</text>
  <circle cx="280" cy="230" r="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="274" y="234" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">L</text>

  <!-- Sitout Balcony -->
  <rect x="120" y="300" width="160" height="140" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="145" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">SITOUT BALCONY</text>
  <text x="165" y="385" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">10'0" x 4'0"</text>

  <!-- Kitchen & Utility -->
  <rect x="280" y="300" width="160" height="140" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="320" y="365" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">KITCHEN</text>
  <text x="325" y="385" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">10'0" x 8'6"</text>
  <!-- Kitchen Platform Indicator -->
  <path d="M 285 305 L 435 305 L 435 340" fill="none" stroke="#2563eb" stroke-width="2"/>

  <!-- Master Bedroom -->
  <rect x="440" y="100" width="240" height="210" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="490" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">MASTER BEDROOM</text>
  <text x="530" y="210" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">12'0" x 13'6"</text>

  <!-- Master Attached Bath -->
  <rect x="560" y="310" width="120" height="130" fill="#eff6ff" stroke="#0f172a" stroke-width="2"/>
  <text x="585" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">TOILET 1</text>
  <text x="585" y="388" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">Attached</text>

  <!-- Common Bath -->
  <rect x="440" y="310" width="120" height="130" fill="#eff6ff" stroke="#0f172a" stroke-width="2"/>
  <text x="465" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">TOILET 2</text>
  <text x="470" y="388" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">Common</text>

  <!-- Structural Columns (RCC Columns in solid black with blue highlight) -->
  <rect x="115" y="95" width="12" height="12" fill="#0f172a"/>
  <rect x="434" y="95" width="12" height="12" fill="#2563eb"/>
  <rect x="674" y="95" width="12" height="12" fill="#0f172a"/>
  <rect x="115" y="294" width="12" height="12" fill="#2563eb"/>
  <rect x="274" y="294" width="12" height="12" fill="#0f172a"/>
  <rect x="434" y="294" width="12" height="12" fill="#2563eb"/>
  <rect x="674" y="304" width="12" height="12" fill="#0f172a"/>
  <rect x="115" y="434" width="12" height="12" fill="#0f172a"/>
  <rect x="274" y="434" width="12" height="12" fill="#2563eb"/>
  <rect x="434" y="434" width="12" height="12" fill="#0f172a"/>
  <rect x="674" y="434" width="12" height="12" fill="#2563eb"/>

  <!-- Dimension line at bottom -->
  <line x1="120" y1="465" x2="680" y2="465" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="360" y="460" font-family="Arial, sans-serif" font-size="11" fill="#2563eb" font-weight="bold">38' 0" OVERALL LENGTH</text>

  <!-- North Orientation Icon -->
  <g transform="translate(730, 60)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-14 6,10 0,6 -6,10" fill="#2563eb"/>
    <text x="-4" y="-18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">N</text>
  </g>
</svg>

