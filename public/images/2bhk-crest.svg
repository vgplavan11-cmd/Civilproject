<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff;">
  <defs>
    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arrow2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#grid2)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Stamp -->
  <rect x="40" y="35" width="280" height="42" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">XYZ CIVIL ENGINEERING ARCHIVE</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="600">PLAN: 2BHK CREST DELUXE (1,260 SQ.FT)</text>

  <!-- External Building Perimeter -->
  <rect x="100" y="95" width="600" height="340" fill="#ffffff" stroke="#0f172a" stroke-width="5" rx="2"/>

  <!-- Living & Work Suite -->
  <rect x="100" y="95" width="280" height="220" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="170" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">GRAND LIVING</text>
  <text x="180" y="185" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">17'6" x 12'0"</text>

  <!-- Dedicated Work Suite -->
  <rect x="100" y="235" width="130" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="115" y="275" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">STUDY / WORK</text>
  <text x="125" y="295" font-family="Arial, sans-serif" font-size="9" fill="#0f172a">8'0" x 6'0"</text>

  <!-- Balcony 1 -->
  <rect x="100" y="315" width="160" height="120" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="125" y="375" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">SUNSET DECK</text>
  <text x="145" y="395" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">Wide Balcony</text>

  <!-- Kitchen & Dining -->
  <rect x="260" y="315" width="180" height="120" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="310" y="375" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">KITCHEN</text>
  <text x="310" y="395" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">11'0" x 9'0"</text>

  <!-- Master Suite -->
  <rect x="380" y="95" width="320" height="220" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="470" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">MASTER SUITE</text>
  <text x="490" y="185" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">13'0" x 14'0"</text>
  <!-- Walk-in Wardrobe recess -->
  <rect x="610" y="95" width="90" height="100" fill="#f1f5f9" stroke="#0f172a" stroke-width="1.5"/>
  <text x="630" y="150" font-family="Arial, sans-serif" font-size="10" fill="#64748b">WALK-IN</text>

  <!-- Bedroom 2 -->
  <rect x="440" y="315" width="260" height="120" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="515" y="370" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">BEDROOM 2</text>
  <text x="525" y="390" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">11'6" x 12'0"</text>

  <!-- Columns -->
  <rect x="95" y="90" width="12" height="12" fill="#2563eb"/>
  <rect x="374" y="90" width="12" height="12" fill="#0f172a"/>
  <rect x="694" y="90" width="12" height="12" fill="#2563eb"/>
  <rect x="95" y="309" width="12" height="12" fill="#0f172a"/>
  <rect x="254" y="309" width="12" height="12" fill="#2563eb"/>
  <rect x="434" y="309" width="12" height="12" fill="#0f172a"/>
  <rect x="694" y="309" width="12" height="12" fill="#2563eb"/>
  <rect x="95" y="429" width="12" height="12" fill="#2563eb"/>
  <rect x="254" y="429" width="12" height="12" fill="#0f172a"/>
  <rect x="434" y="429" width="12" height="12" fill="#2563eb"/>
  <rect x="694" y="429" width="12" height="12" fill="#0f172a"/>

  <!-- Dimension line -->
  <line x1="100" y1="460" x2="700" y2="460" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrow2)" marker-end="url(#arrow2)"/>
  <text x="365" y="455" font-family="Arial, sans-serif" font-size="11" fill="#2563eb" font-weight="bold">42' 0" SPAN</text>

  <g transform="translate(730, 60)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-14 6,10 0,6 -6,10" fill="#2563eb"/>
    <text x="-4" y="-18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">N</text>
  </g>
</svg>

