<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff;">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arrow3" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#grid3)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Stamp -->
  <rect x="40" y="35" width="280" height="42" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">XYZ CIVIL ENGINEERING ARCHIVE</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="600">PLAN: 3BHK ROYAL PALM (1,680 SQ.FT)</text>

  <!-- External Building Perimeter -->
  <rect x="80" y="95" width="640" height="340" fill="#ffffff" stroke="#0f172a" stroke-width="5" rx="2"/>

  <!-- Living Hall & Dining Pavilion -->
  <rect x="80" y="95" width="360" height="200" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="180" y="180" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">GRAND LIVING &amp; DINING</text>
  <text x="230" y="200" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">20'4" x 13'6"</text>

  <!-- Veranda / Landscape Balcony -->
  <rect x="80" y="295" width="200" height="140" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="125" y="360" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">LANDSCAPE BALCONY</text>
  <text x="145" y="380" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">14'0" x 5'0"</text>

  <!-- Kitchen & Scullery -->
  <rect x="280" y="295" width="160" height="140" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="325" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">KITCHEN</text>
  <text x="330" y="380" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">12'0" x 9'6"</text>

  <!-- Master Suite -->
  <rect x="440" y="95" width="280" height="180" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="515" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">MASTER SUITE</text>
  <text x="540" y="185" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">14'0" x 15'0"</text>

  <!-- Bedroom 2 -->
  <rect x="440" y="275" width="140" height="160" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="465" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">BEDROOM 2</text>
  <text x="475" y="370" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">12'0" x 13'0"</text>

  <!-- Bedroom 3 / Guest Room -->
  <rect x="580" y="275" width="140" height="160" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="605" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">BEDROOM 3</text>
  <text x="615" y="370" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">11'0" x 12'0"</text>

  <!-- RCC Columns grid -->
  <rect x="75" y="90" width="12" height="12" fill="#2563eb"/>
  <rect x="434" y="90" width="12" height="12" fill="#0f172a"/>
  <rect x="714" y="90" width="12" height="12" fill="#2563eb"/>
  <rect x="75" y="289" width="12" height="12" fill="#0f172a"/>
  <rect x="274" y="289" width="12" height="12" fill="#2563eb"/>
  <rect x="434" y="269" width="12" height="12" fill="#0f172a"/>
  <rect x="574" y="269" width="12" height="12" fill="#2563eb"/>
  <rect x="714" y="269" width="12" height="12" fill="#0f172a"/>
  <rect x="75" y="429" width="12" height="12" fill="#2563eb"/>
  <rect x="274" y="429" width="12" height="12" fill="#0f172a"/>
  <rect x="434" y="429" width="12" height="12" fill="#2563eb"/>
  <rect x="574" y="429" width="12" height="12" fill="#0f172a"/>
  <rect x="714" y="429" width="12" height="12" fill="#2563eb"/>

  <!-- Dimension line -->
  <line x1="80" y1="465" x2="720" y2="465" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrow3)" marker-end="url(#arrow3)"/>
  <text x="365" y="460" font-family="Arial, sans-serif" font-size="11" fill="#2563eb" font-weight="bold">46' 0" OVERALL SPAN</text>

  <g transform="translate(740, 60)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-14 6,10 0,6 -6,10" fill="#2563eb"/>
    <text x="-4" y="-18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">N</text>
  </g>
</svg>

