<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff;">
  <defs>
    <pattern id="grid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arrow5" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#grid5)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Stamp -->
  <rect x="40" y="35" width="300" height="42" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">XYZ CIVIL ENGINEERING ARCHIVE</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="600">VILLA: 4BHK SOVEREIGN ESTATE (3,150 SQ.FT)</text>

  <!-- External Building Perimeter -->
  <rect x="70" y="95" width="660" height="340" fill="#ffffff" stroke="#0f172a" stroke-width="5" rx="2"/>

  <!-- Covered Double Portico -->
  <rect x="70" y="95" width="180" height="150" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="95" y="165" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">DOUBLE CAR PORTICO</text>
  <text x="110" y="185" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">Heavy Load Pavement</text>

  <!-- Central Open Courtyard -->
  <rect x="250" y="190" width="160" height="150" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="330" cy="265" r="28" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="275" y="260" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">OPEN COURTYARD</text>
  <text x="285" y="280" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">Bio-Climatic Void</text>

  <!-- Grand Living Salon -->
  <rect x="250" y="95" width="480" height="95" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="440" y="145" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">GRAND LIVING &amp; FORMAL SALON (26' x 16')</text>

  <!-- Master Presidential Suite -->
  <rect x="410" y="190" width="320" height="150" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="495" y="260" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">PRESIDENTIAL SUITE</text>
  <text x="535" y="280" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">17'0" x 16'6"</text>

  <!-- Kitchen & Dining Pavilion -->
  <rect x="70" y="245" width="180" height="190" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="95" y="340" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">KITCHEN &amp; DINING</text>
  <text x="115" y="360" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">15'0" x 11'0"</text>

  <!-- Pool Deck / Sunken Garden -->
  <rect x="250" y="340" width="480" height="95" fill="#f0f9ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="440" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">WATER PAVILION &amp; SUNDECK</text>
  <text x="460" y="410" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">Reinforced Pool Slab Provision</text>

  <!-- Heavy Raft Columns -->
  <rect x="65" y="90" width="14" height="14" fill="#2563eb"/>
  <rect x="244" y="90" width="14" height="14" fill="#0f172a"/>
  <rect x="404" y="90" width="14" height="14" fill="#2563eb"/>
  <rect x="724" y="90" width="14" height="14" fill="#0f172a"/>
  <rect x="65" y="239" width="14" height="14" fill="#0f172a"/>
  <rect x="244" y="184" width="14" height="14" fill="#2563eb"/>
  <rect x="404" y="184" width="14" height="14" fill="#0f172a"/>
  <rect x="724" y="184" width="14" height="14" fill="#2563eb"/>
  <rect x="65" y="429" width="14" height="14" fill="#2563eb"/>
  <rect x="244" y="334" width="14" height="14" fill="#0f172a"/>
  <rect x="404" y="334" width="14" height="14" fill="#2563eb"/>
  <rect x="724" y="429" width="14" height="14" fill="#0f172a"/>

  <!-- Dimension line -->
  <line x1="70" y1="465" x2="730" y2="465" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrow5)" marker-end="url(#arrow5)"/>
  <text x="365" y="460" font-family="Arial, sans-serif" font-size="11" fill="#2563eb" font-weight="bold">52' 0" OVERALL SPAN</text>

  <g transform="translate(745, 60)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-14 6,10 0,6 -6,10" fill="#2563eb"/>
    <text x="-4" y="-18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">N</text>
  </g>
</svg>

