<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff;">
  <defs>
    <pattern id="grid6" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arrow6" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#grid6)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Stamp -->
  <rect x="40" y="35" width="310" height="42" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">XYZ CIVIL ENGINEERING ARCHIVE</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="600">COMMERCIAL: PINNACLE TOWER (11,200 SQ.FT)</text>

  <!-- External Building Outline -->
  <rect x="80" y="95" width="640" height="340" fill="#ffffff" stroke="#0f172a" stroke-width="5" rx="2"/>

  <!-- Open Floor Plate Column-free Office Space -->
  <rect x="80" y="95" width="460" height="340" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="180" y="220" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">OPEN-SPAN CORPORATE FLOOR</text>
  <text x="210" y="245" font-family="Arial, sans-serif" font-size="12" fill="#2563eb" font-weight="600">Post-Tensioned (PT) Flat Slab System</text>
  <text x="220" y="270" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Capacity: 120 Workstations / Retail Unit</text>

  <!-- Service Core (Elevators, Stairwells, AHU, Fire Shaft) -->
  <rect x="540" y="95" width="180" height="340" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.5"/>
  <text x="575" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">SERVICE CORE</text>

  <!-- Elevators -->
  <rect x="560" y="160" width="60" height="60" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="575" y="195" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">LIFT 1</text>

  <rect x="640" y="160" width="60" height="60" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="655" y="195" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">LIFT 2</text>

  <!-- Fire Escape Stairwell -->
  <rect x="560" y="240" width="140" height="80" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="560" y1="260" x2="700" y2="260" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="560" y1="280" x2="700" y2="280" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="560" y1="300" x2="700" y2="300" stroke="#cbd5e1" stroke-width="1"/>
  <text x="585" y="285" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">FIRE STAIRWELL</text>

  <!-- Restrooms & Ducts -->
  <rect x="560" y="340" width="140" height="80" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="595" y="385" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">RESTROOMS</text>

  <!-- Heavy Perimeter Piles / Columns -->
  <rect x="75" y="90" width="14" height="14" fill="#0f172a"/>
  <rect x="305" y="90" width="14" height="14" fill="#2563eb"/>
  <rect x="534" y="90" width="14" height="14" fill="#0f172a"/>
  <rect x="714" y="90" width="14" height="14" fill="#2563eb"/>

  <rect x="75" y="429" width="14" height="14" fill="#2563eb"/>
  <rect x="305" y="429" width="14" height="14" fill="#0f172a"/>
  <rect x="534" y="429" width="14" height="14" fill="#2563eb"/>
  <rect x="714" y="429" width="14" height="14" fill="#0f172a"/>

  <!-- Dimension line -->
  <line x1="80" y1="465" x2="720" y2="465" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrow6)" marker-end="url(#arrow6)"/>
  <text x="360" y="460" font-family="Arial, sans-serif" font-size="11" fill="#2563eb" font-weight="bold">56' 0" COLUMN SPAN</text>

  <g transform="translate(745, 60)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-14 6,10 0,6 -6,10" fill="#2563eb"/>
    <text x="-4" y="-18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">N</text>
  </g>
</svg>

