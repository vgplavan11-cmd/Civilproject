<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#ffffff;">
  <defs>
    <pattern id="grid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
    <marker id="arrow4" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#grid4)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Stamp -->
  <rect x="40" y="35" width="280" height="42" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="50" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">XYZ CIVIL ENGINEERING ARCHIVE</text>
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="10" fill="#2563eb" font-weight="600">DUPLEX: 3BHK SKYLINE (1,980 SQ.FT)</text>

  <!-- External Building Outline -->
  <rect x="90" y="95" width="620" height="340" fill="#ffffff" stroke="#0f172a" stroke-width="5" rx="2"/>

  <!-- Double Height Living -->
  <rect x="90" y="95" width="320" height="230" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="145" y="180" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">DOUBLE HEIGHT LIVING</text>
  <text x="175" y="200" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">22'0" x 14'6" (18ft Void)</text>

  <!-- Cantilever Staircase zone -->
  <rect x="90" y="325" width="160" height="110" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="110" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">FLOATING STAIRS</text>
  <text x="125" y="400" font-family="Arial, sans-serif" font-size="10" fill="#0f172a">To Upper Level</text>

  <!-- Island Kitchen -->
  <rect x="250" y="325" width="160" height="110" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="280" y="380" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">ISLAND KITCHEN</text>
  <text x="295" y="400" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">13'0" x 10'0"</text>

  <!-- Upper Master Suite & Terrace -->
  <rect x="410" y="95" width="300" height="190" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="475" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">EXECUTIVE SUITE</text>
  <text x="500" y="185" font-family="Arial, sans-serif" font-size="11" fill="#2563eb">15'6" x 14'0"</text>

  <!-- Sunset Terrace Deck -->
  <rect x="410" y="285" width="300" height="150" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="490" y="360" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">PRIVATE SKY DECK</text>
  <text x="510" y="380" font-family="Arial, sans-serif" font-size="11" fill="#0f172a">180 Sq. Ft. Lounge</text>

  <!-- RCC Columns -->
  <rect x="85" y="90" width="12" height="12" fill="#2563eb"/>
  <rect x="404" y="90" width="12" height="12" fill="#0f172a"/>
  <rect x="704" y="90" width="12" height="12" fill="#2563eb"/>
  <rect x="85" y="319" width="12" height="12" fill="#0f172a"/>
  <rect x="244" y="319" width="12" height="12" fill="#2563eb"/>
  <rect x="404" y="279" width="12" height="12" fill="#2563eb"/>
  <rect x="704" y="279" width="12" height="12" fill="#0f172a"/>
  <rect x="85" y="429" width="12" height="12" fill="#2563eb"/>
  <rect x="244" y="429" width="12" height="12" fill="#0f172a"/>
  <rect x="404" y="429" width="12" height="12" fill="#2563eb"/>
  <rect x="704" y="429" width="12" height="12" fill="#2563eb"/>

  <!-- Dimension line -->
  <line x1="90" y1="465" x2="710" y2="465" stroke="#2563eb" stroke-width="1.5" marker-start="url(#arrow4)" marker-end="url(#arrow4)"/>
  <text x="365" y="460" font-family="Arial, sans-serif" font-size="11" fill="#2563eb" font-weight="bold">44' 0" STRUCTURAL SPAN</text>

  <g transform="translate(740, 60)">
    <circle cx="0" cy="0" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-14 6,10 0,6 -6,10" fill="#2563eb"/>
    <text x="-4" y="-18" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">N</text>
  </g>
</svg>

